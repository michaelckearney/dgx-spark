---
name: lint

# The point of this is not to catch mistakes in review. It is to stop the slow
# drift that made a previous version of this repo hard to read: a syntax check
# and a linter are what keep "we'll tidy it later" from being open-ended.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and the linter
        run: pip install ansible-core ansible-lint

      - name: Check the playbook parses
        run: ansible-playbook site.yml --syntax-check

      - name: Lint
        run: ansible-lint

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup.sh
        run: shellcheck setup.sh
