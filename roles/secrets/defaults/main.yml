---
# The credential store. Plain root-owned files, mode 0600, in a 0700
# directory. Deliberately not encrypted: the same values end up in plaintext
# in gh's token store and ~/.hermes/.env on this same disk, so encrypting the
# source while its copies sit unencrypted would be ceremony rather than
# security. Protecting the disk is a full-disk encryption question.
#
# NOT in this repo and never should be. Back it up separately — a git clone
# plus a restored credstore is what lets ./setup.sh rebuild this machine with
# nobody retyping anything.
secrets_dir: /etc/dgx-spark/credstore

# A secret that was offered and declined leaves a marker here, so the next run
# does not ask again. Three states per secret, not two: stored, declined, or
# never asked. Only the last one prompts, and only when a human is present.
secrets_declined_dir: /etc/dgx-spark/declined

# Everything this setup needs a human for. Adding a secret is an entry here
# plus one task in the role that consumes it — there is no prompt code to
# write, which is what stops three prompts drifting into three behaviours.
#
#   name          file in the credstore
#   title         used as the Ansible task name, so write it for a human
#   help          shown above the prompt
#   prompt        the input line itself
#   validate      regex the answer must match. Empty input always passes, so
#                 pressing Enter to skip never burns a retry and never fails
#                 the run.
#   invalid_hint  what to say when it does not match
#   requires      only ask once this other secret is stored
secrets_manifest:
  - name: github
    title: "GitHub personal access token"
    help: |
      Create one at https://github.com/settings/tokens
      Use a CLASSIC token with BOTH of these scopes:
          repo        push over HTTPS
          read:org    gh auth login refuses the token without it
      Fine-grained tokens do not advertise scopes the way gh checks for them.
      A PAT does not refresh itself: when it expires, pushes start failing.
    prompt: "Paste the token, or press Enter to skip"
    validate: '^gh[pousr]_[A-Za-z0-9]{36,}$|^github_pat_[A-Za-z0-9_]{22,}$'
    invalid_hint: "expected a token starting ghp_, gho_ or github_pat_"

  - name: telegram
    title: "Telegram bot token for the Hermes gateway"
    help: |
      Create a bot with @BotFather at https://t.me/BotFather
      Skipping this is fine. Hermes works from the terminal without it.
    prompt: "Paste the bot token, or press Enter to skip"
    validate: '^[0-9]+:[A-Za-z0-9_-]{30,}$'
    invalid_hint: "expected <digits>:<30 or more characters>"

  - name: telegram_allowed_users
    title: "Telegram user IDs allowed to talk to the bot"
    help: |
      Get your numeric ID from @userinfobot at https://t.me/userinfobot
      Blank is safe: Hermes denies unknown senders and routes them through DM
      pairing. Blank does NOT mean anyone can use the bot.
    prompt: "Comma-separated IDs, or press Enter for DM pairing"
    validate: '^[0-9,]+$'
    invalid_hint: "digits and commas only"
    # No point asking until there is a bot for people to talk to.
    requires: telegram

  - name: tailscale
    title: "Tailscale credential, to reach this machine from anywhere"
    help: |
      Prefer an OAUTH CLIENT SECRET over a one-off auth key:
          https://login.tailscale.com/admin/settings/oauth
      Auth keys expire within 90 days and one-off keys work exactly once, so a
      stored auth key rots in place. It rots silently, to be discovered on the
      day you rebuild this machine. An OAuth client secret does not expire.
      It needs a tag: set tailscale_tags in inventory/group_vars/all/main.yml.
      A one-off key still works if you want to get moving:
          https://login.tailscale.com/admin/settings/keys
    prompt: "Paste the secret or key, or press Enter to skip"
    validate: '^tskey-'
    invalid_hint: "expected a value starting tskey-"
