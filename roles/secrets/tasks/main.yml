---
# Role: secrets
# Asks for what this machine still needs, remembers the answers, and applies
# them. There is no separate configure script: a human running ./setup.sh gets
# asked, an agent running the same command does not.
#
# Three states per secret, not two — stored, declined, or never asked. Only
# the last one prompts. Without the declined marker, every run would nag about
# a decision you already made, which is the fastest way to train someone to
# stop reading prompts.
#
# `interactive` comes from setup.sh, which knows whether a human is present
# because that is a question about the terminal, not about Ansible. Left to
# itself `pause` degrades safely without a tty — it warns and returns empty —
# but it warns once per prompt, and that noise is what the flag suppresses.

- name: Ensure the credential store exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ secrets_dir }}"
    - "{{ secrets_declined_dir }}"
  become: true

- name: Check which secrets are already stored
  ansible.builtin.stat:
    path: "{{ secrets_dir }}/{{ item.name }}"
  loop: "{{ secrets_manifest }}"
  loop_control:
    label: "{{ item.name }}"
  register: secrets_stored_probe
  become: true

- name: Check which secrets were declined
  ansible.builtin.stat:
    path: "{{ secrets_declined_dir }}/{{ item.name }}"
  loop: "{{ secrets_manifest }}"
  loop_control:
    label: "{{ item.name }}"
  register: secrets_declined_probe
  become: true

- name: Note what is stored and what was declined
  ansible.builtin.set_fact:
    secrets_stored: "{{ secrets_stored_probe.results | selectattr('stat.exists') | map(attribute='item.name') | list }}"
    secrets_declined: "{{ secrets_declined_probe.results | selectattr('stat.exists') | map(attribute='item.name') | list }}"

# A loop with a `when:` rather than a filter chain, because the condition is
# three clauses and one of them depends on another secret's state. Readable
# beats clever in the place people will come to add a secret.
- name: Work out what still needs an answer
  ansible.builtin.set_fact:
    secrets_to_ask: "{{ secrets_to_ask | default([]) + [item] }}"
  loop: "{{ secrets_manifest }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name not in secrets_stored
    - item.name not in secrets_declined
    - item.requires is not defined or item.requires in secrets_stored

# --- ask ---------------------------------------------------------------------

- name: Tell the user what is about to be asked
  ansible.builtin.debug:
    msg: >-
      This machine still needs {{ secrets_to_ask | length }} thing(s) from you.
      Press Enter at any prompt to skip it — you will not be asked again, and
      nothing else breaks.
  when:
    - interactive | default(false) | bool
    - secrets_to_ask | default([]) | length > 0

# The prompt text carries everything, and the task name stays static: the
# pause action prefixes its own output with the task's name, and that name is
# not re-templated per loop item.
#
# `until` accepts empty input as well as a valid value, so pressing Enter to
# skip never burns a retry and never fails the run. delay: 0 because the
# default five-second sleep between attempts is unbearable in front of a
# person who has just made a typo.
- name: Setting up
  ansible.builtin.pause:
    prompt: |

      {{ item.title }}
      {{ '-' * (item.title | length) }}
      {{ item.help }}
      {{ item.prompt }}
      (must {{ item.invalid_hint }})
    echo: false
  loop: "{{ secrets_to_ask | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: secrets_answers
  until: >-
    (secrets_answers.user_input | default('') | trim) == ''
    or (secrets_answers.user_input | default('') | trim) is match(item.validate)
  retries: 3
  delay: 0
  when: interactive | default(false) | bool
  no_log: true

- name: Store what you supplied
  ansible.builtin.copy:
    content: "{{ item.user_input | trim }}"
    dest: "{{ secrets_dir }}/{{ item.item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ secrets_answers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.user_input is defined
    - (item.user_input | trim) != ''
  become: true
  no_log: true

- name: Remember what you declined, so you are not asked again
  ansible.builtin.copy:
    content: |
      Declined on {{ ansible_date_time.iso8601 }}.
      Delete this file to be asked about {{ item.item.name }} again.
    dest: "{{ secrets_declined_dir }}/{{ item.item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ secrets_answers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.user_input is defined
    - (item.user_input | trim) == ''
  become: true

# Re-read after writing, so the apply steps below see anything just supplied.
- name: Re-check what is stored
  ansible.builtin.stat:
    path: "{{ secrets_dir }}/{{ item.name }}"
  loop: "{{ secrets_manifest }}"
  loop_control:
    label: "{{ item.name }}"
  register: secrets_final_probe
  become: true

- name: Note the final state
  ansible.builtin.set_fact:
    secrets_stored: "{{ secrets_final_probe.results | selectattr('stat.exists') | map(attribute='item.name') | list }}"

- name: Apply each stored secret
  ansible.builtin.include_tasks: "apply_{{ item }}.yml"
  loop: "{{ ['github', 'telegram', 'tailscale'] }}"
  when: item in secrets_stored

# --- report ------------------------------------------------------------------

- name: Say what is set up and what is not
  ansible.builtin.debug:
    msg: >-
      Secrets — stored: {{ secrets_stored | join(', ') | default('none', true) }}.
      {% if secrets_declined | length > 0 %}
      Declined: {{ secrets_declined | join(', ') }} (delete the matching file in
      {{ secrets_declined_dir }} to be asked again).
      {% endif %}
      {% if not (interactive | default(false) | bool) and (secrets_to_ask | default([]) | length > 0) %}
      Not set up yet: {{ secrets_to_ask | map(attribute='name') | join(', ') }} —
      run ./setup.sh from a terminal to supply them.
      {% endif %}
