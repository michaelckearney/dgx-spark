---
# gh will hand its own token back, so this is a plain diff: re-authenticate
# only when the stored value and the live one differ.
#
# No become on the gh tasks. The play runs as the login user and gh keeps its
# token per-user, so this is simply correct without saying anything.

- name: Read the stored GitHub token
  ansible.builtin.slurp:
    src: "{{ secrets_dir }}/github"
  register: github_stored
  become: true
  no_log: true

# Exits non-zero when nothing is authenticated, which is the normal first-run
# state and not an error.
- name: Ask gh for its current token
  ansible.builtin.command: gh auth token
  register: github_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

# On stdin, never in argv — argv is world-readable via ps for the life of the
# process.
- name: Authenticate gh
  ansible.builtin.command: gh auth login --with-token
  args:
    stdin: "{{ github_stored.content | b64decode | trim }}"
  when: >-
    github_current.rc != 0
    or (github_current.stdout | trim) != (github_stored.content | b64decode | trim)
  no_log: true
