---
# gh will hand its own token back, so this is a plain diff: re-authenticate
# only when the stored value and the live one differ.
#
# No become on the gh tasks. The play runs as the login user and gh keeps its
# token per-user, so this is simply correct without saying anything.

- name: Read the stored GitHub token
  ansible.builtin.slurp:
    src: "{{ secrets_dir }}/github"
  register: secrets_github_stored
  become: true
  no_log: true

# Exits non-zero when nothing is authenticated, which is the normal first-run
# state and not an error.
- name: Ask gh for its current token
  ansible.builtin.command: gh auth token
  register: secrets_github_current
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

# On stdin, never in argv — argv is world-readable via ps for the life of the
# process.
- name: Authenticate gh
  ansible.builtin.command: gh auth login --with-token
  args:
    stdin: "{{ secrets_github_stored.content | b64decode | trim }}"
  register: secrets_github_login
  when: >-
    secrets_github_current.rc != 0
    or (secrets_github_current.stdout | trim) != (secrets_github_stored.content | b64decode | trim)
  no_log: true

# --- ghcr.io -----------------------------------------------------------------
# A derived credential: the same GitHub token authenticates docker against the
# GitHub Container Registry, so pulling a private image needs no second secret
# and nothing extra to rotate.
#
# `docker login` would happily re-run every converge and report a change each
# time, so it is gated on the registry not already being in the docker config.
# The `secrets_github_login is changed` half of the condition is what makes a rotated
# token actually reach docker rather than leaving a stale one in place.

- name: Check whether docker is already authenticated to ghcr.io
  ansible.builtin.command: "grep -q ghcr.io {{ ansible_facts['env']['HOME'] }}/.docker/config.json"
  register: secrets_ghcr_auth
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ask GitHub who this token belongs to
  ansible.builtin.command: gh api user --jq .login
  register: secrets_gh_login_name
  changed_when: false
  failed_when: false
  check_mode: false
  when: secrets_ghcr_auth.rc != 0 or secrets_github_login is changed

# Password on stdin, never in argv.
- name: Authenticate docker to ghcr.io
  ansible.builtin.command:
    cmd: "docker login ghcr.io -u {{ secrets_gh_login_name.stdout | trim }} --password-stdin"
    stdin: "{{ secrets_github_stored.content | b64decode | trim }}"
  when:
    - secrets_ghcr_auth.rc != 0 or secrets_github_login is changed
    - secrets_gh_login_name.rc | default(1) == 0
  no_log: true
