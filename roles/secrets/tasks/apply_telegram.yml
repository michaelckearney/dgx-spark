---
# The value lives in a readable file, so lineinfile does the diff and the
# handler fires only on a real change. That gate is what stops an unrelated
# converge — an added apt package, say — from restarting the gateway
# underneath a live conversation.

- name: Read the stored Telegram token
  ansible.builtin.slurp:
    src: "{{ secrets_dir }}/telegram"
  register: secrets_telegram_stored
  become: true
  no_log: true

- name: Read the stored Telegram allowlist
  ansible.builtin.slurp:
    src: "{{ secrets_dir }}/telegram_allowed_users"
  register: secrets_telegram_allowed_stored
  become: true
  failed_when: false
  no_log: true

# The default profile's own .env. force: false so a credential written by
# `hermes auth add` or by hand is never clobbered — lineinfile below only
# touches the two keys it names.
- name: Ensure the Hermes .env exists
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.hermes/.env"
    mode: "0600"
    force: false
    content: |
      # Hermes credentials. TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOWED_USERS are
      # managed by the dgx-spark repo; everything else here is yours.

- name: Set the Telegram bot token
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.hermes/.env"
    regexp: '^(export[[:space:]]+)?TELEGRAM_BOT_TOKEN='
    line: "TELEGRAM_BOT_TOKEN={{ secrets_telegram_stored.content | b64decode | trim }}"
    mode: "0600"
  notify: Restart hermes gateway
  no_log: true

# Not via `hermes config set`: that key has no dot, is not in the API-key list,
# and does not end in _TOKEN or _SECRET, so it would land in config.yaml as a
# top-level key that nothing reads. .env is the canonical route.
#
# Written even when empty, so clearing the allowlist actually clears it.
- name: Set the Telegram allowlist
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.hermes/.env"
    regexp: '^(export[[:space:]]+)?TELEGRAM_ALLOWED_USERS='
    line: "TELEGRAM_ALLOWED_USERS={{ (secrets_telegram_allowed_stored.content | default('') | b64decode | trim) }}"
    mode: "0600"
  notify: Restart hermes gateway

# The gateway service itself is installed by the hermes role, unconditionally —
# it runs the cron ticker for every profile, not just Telegram. All this role
# owns is the token, and the handler that restarts the gateway when it changes.
