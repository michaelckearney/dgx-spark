---
# Nothing hands this value back and nothing needs it twice — it is spent at
# join. So the rule is not a diff: it is "are we on the tailnet", and a joined
# machine is left completely alone.

# `tailscale status` exits non-zero when logged out, so it doubles as the
# joined-or-not probe without needing jq to read the backend state.
- name: Check whether this machine is already on the tailnet
  ansible.builtin.command: tailscale status
  register: secrets_tailscale_state
  changed_when: false
  failed_when: false
  check_mode: false

# EVERYTHING BELOW IS GATED ON NOT BEING JOINED, and that gate is the most
# important line in this role.
#
# An unconditional `tailscale up` against a working node re-authenticates it.
# If the stored credential has since expired, been revoked, or was stored
# wrong, that turns a routine converge into a lockout on the one path that
# reaches this machine remotely. A joined node is left alone every time, and
# the stored credential exists for the next rebuild rather than for this run.
- name: Join the tailnet
  when: secrets_tailscale_state.rc != 0
  block:

    - name: Read the stored Tailscale credential
      ansible.builtin.slurp:
        src: "{{ secrets_dir }}/tailscale"
      register: secrets_tailscale_stored
      become: true
      no_log: true

    # By file reference rather than on the command line: argv is
    # world-readable via ps for as long as the process runs.
    - name: Stage the credential where tailscale can read it
      ansible.builtin.copy:
        dest: /run/tailscale-authkey
        content: "{{ secrets_tailscale_stored.content | b64decode | trim }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    # --operator is the login user and NOT `id -un`. Under become that would
    # resolve to root, leaving the real user needing sudo for `tailscale
    # status`.
    #
    # No --reset. `tailscale up` refusing a changed flag set is information,
    # not something to paper over.
    - name: Bring the tailnet interface up
      ansible.builtin.command: >-
        tailscale up
        --auth-key=file:/run/tailscale-authkey
        --operator={{ ansible_facts['user_id'] }}
        {% if tailscale_tags %}--advertise-tags={{ tailscale_tags }}{% endif %}
      register: secrets_tailscale_up
      become: true

  rescue:
    # An OAuth client secret requires a tag and an auth key does not, which is
    # far and away the most common way a first join fails. Say so rather than
    # leaving someone to decode Tailscale's raw error.
    - name: Explain the most likely cause, then fail
      ansible.builtin.fail:
        msg: >-
          Joining the tailnet failed.
          An OAuth client secret requires a tag: set tailscale_tags in
          inventory/group_vars/all/main.yml to a tag the client is scoped to,
          and make sure that tag exists in your tailnet ACL. A one-off auth key
          needs no tag, but works exactly once and expires within 90 days.
          The stored credential was not changed.
          tailscale said: {{ secrets_tailscale_up.stderr | default('(nothing on stderr)') }}

  always:
    - name: Remove the staged credential
      ansible.builtin.file:
        path: /run/tailscale-authkey
        state: absent
      become: true

- name: Note that a joined machine is deliberately left alone
  ansible.builtin.debug:
    msg: >-
      Already on the tailnet, so the stored credential was not applied. That is
      deliberate: re-running `tailscale up` against a working node could lock
      you out if the credential has since expired. It is kept for the next
      rebuild.
  when: secrets_tailscale_state.rc == 0
