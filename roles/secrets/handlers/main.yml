---
# `gateway install` returns without restarting when the unit already exists,
# and the gateway reads ~/.hermes/.env only at startup. So on a rotation the
# running process would keep serving the old token while the file held the new
# one. This handler is what makes rotation take effect — and because it is a
# handler, it fires only when a token line actually changed.
- name: restart hermes gateway
  ansible.builtin.command: hermes gateway restart
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
