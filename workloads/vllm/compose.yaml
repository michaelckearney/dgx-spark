# vLLM serving nvidia/Qwen3.6-35B-A3B-NVFP4 on the DGX Spark.
#
# NOTHING STARTS THIS FOR YOU THE FIRST TIME. There is no Ansible role for it
# and no systemd unit. Launch it by hand when you want it:
#
#     docker compose -f workloads/vllm/compose.yaml up -d --wait
#
# It does carry `restart: unless-stopped` — see the note on that line. Once
# started it comes back after a crash or a reboot, but it stays down after you
# deliberately stop it.
#
# The serve flags are the verified dgx_spark_gb10 profile from the vLLM
# recipe, not hand-tuned. Read README.md before changing any of them.

# Pinned so the project name doesn't change with the invoking directory —
# `docker compose ls` and teardown stay predictable from anywhere.
name: dgx-spark-vllm

services:
  vllm:
    image: vllm/vllm-openai:v0.28.0
    container_name: vllm-server

    # The one workload with a restart policy, and the reason is specific.
    #
    # vLLM can die mid-flight: EngineCore hit
    #   CUDA error: CUBLAS_STATUS_INTERNAL_ERROR ... cublasGemmEx
    # after ~13h, the API server shut itself down cleanly in response, and the
    # container stayed dead. Meanwhile the Hermes Telegram gateway — which does
    # auto-start — kept accepting messages it had no model to answer. A dead
    # backend behind a live bot is silent and confusing.
    #
    # `unless-stopped` covers crashes, Docker daemon restarts and reboots, while
    # still respecting a deliberate `docker compose down` / `docker stop`. That
    # keeps the rule this repo actually cares about: nothing resurrects a thing
    # you chose to stop. It only revives what stopped by accident.
    restart: unless-stopped

    gpus: all
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    # The image's default entrypoint is cleared so `command` below is the
    # whole invocation, matching NVIDIA's playbook.
    entrypoint: ""

    ports:
      # Loopback only, deliberately. The endpoint has no authentication of any
      # kind — anyone who can reach it can use the model. NVIDIA's playbook
      # writes "8000:8000" here, which binds every interface; this does not.
      - "127.0.0.1:8000:8000"

    volumes:
      # Share the host HuggingFace cache so the 21.85 GiB checkpoint survives
      # container removal and is not re-downloaded.
      - ${HOME}/.cache/huggingface/hub:/root/.cache/huggingface/hub

    # Docker publishes port 8000 the instant the container starts, so a plain
    # "is it Up?" check reports success while curl still gets "connection reset
    # by peer" — the engine hasn't bound the port inside the container yet.
    # /health is vLLM's own readiness endpoint and only answers once the model
    # is actually loaded, so `docker compose ps` and `up --wait` report real
    # readiness instead of mere existence.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A cold start downloads 21.85 GiB and then loads and compiles the model.
      # Checks that fail inside start_period don't count toward `retries`, so
      # this only has to exceed a worst-case first run; a warm start (cache
      # already populated) is a few minutes and goes healthy as soon as it can.
      start_period: 45m
      start_interval: 15s

    command:
      - vllm
      - serve
      - nvidia/Qwen3.6-35B-A3B-NVFP4
      - --trust-remote-code
      # --- verified dgx_spark_gb10 profile ---
      - --kv-cache-dtype=fp8
      - --attention-backend=flashinfer
      - --moe-backend=marlin
      - --gpu-memory-utilization=0.5
      - --max-model-len=262144
      - --max-num-seqs=8
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --load-format=fastsafetensors
      # --- tool_calling + reasoning features (required by Hermes) ---
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
