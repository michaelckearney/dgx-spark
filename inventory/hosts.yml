# This repo configures the machine you run it on.
#
# `ansible_connection: local` is the whole point: you clone this on the DGX
# Spark and run ./setup.sh there. There is no SSH, no control node, and
# nothing to configure before the first run.
#
# To drive a different machine instead, add it here with an ansible_host and
# run `ansible-playbook site.yml --limit <name>`. Nothing in the roles assumes
# a local connection.
all:
  hosts:
    spark:
      ansible_connection: local
