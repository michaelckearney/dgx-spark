# Shared variables for all hosts

# Target user to configure (passed explicitly by setup.sh)
#
# ansible_facts['user_id'] rather than the bare ansible_user_id: top-level fact
# injection (INJECT_FACTS_AS_VARS) is deprecated and goes away in ansible-core
# 2.24. This particular line is normally shadowed by setup.sh's --extra-vars,
# so it never warned — it would simply have broken later.
target_user: "{{ ansible_facts['user_id'] }}"
target_home: "/home/{{ target_user }}"

# chezmoi source directory, resolved relative to this repo checkout
chezmoi_source: "{{ playbook_dir | dirname }}/chezmoi"

# Git identity written into ~/.gitconfig by chezmoi.
#
# These default to the machine's own user@host so the repo runs as-is for
# anyone, with an obviously-placeholder identity rather than someone else's.
# Set them to your own — either edit here, or override per run:
#
#   ./setup.sh --extra-vars "git_user_name='Ada Lovelace' git_user_email=ada@example.com"
git_user_name: "{{ target_user }}"
git_user_email: "{{ target_user }}@{{ ansible_facts['hostname'] }}"

# Where Ollama stores model weights. This is Ollama's own default, pinned
# explicitly via a systemd drop-in so the location is never a surprise.
ollama_models_dir: "/usr/share/ollama/.ollama/models"

# llama-swap — the model gateway, and the one daemon this repo runs.
#
# Pinned with a checksum. An unpinned gateway is a config format that changes
# under a service you don't watch; the checksum is what makes the pin mean
# something. Bump both together from the release's checksums file:
#   https://github.com/mostlygeek/llama-swap/releases
#
# Note the tag carries a "v" and the release asset filename does not — the
# role strips it (llama-swap_253_linux_arm64.tar.gz).
llama_swap_version: "v253"
llama_swap_sha256: "sha256:7ccf4e1920cf36c041e2cabe2388676a4755c9763c396cfb2f9fd46649788a90"
llama_swap_user: "llama-swap"

# Explicit because llama-swap's own default is :8080 — every interface —
# on an endpoint with no authentication of any kind. Loopback is the whole of
# the access control here, same as for the vLLM container it replaces.
llama_swap_listen: "127.0.0.1:8000"

llama_swap_config_dir: "/etc/llama-swap"

# The catalogue lives in workloads/ next to the vLLM docs that explain its
# flags, and Ansible copies it to /etc. Same cross-repo reference as
# chezmoi_source above.
llama_swap_config_source: "{{ playbook_dir | dirname }}/workloads/llama-swap/config.yaml"

# Injected into the service environment as HF_CACHE and referenced from
# config.yaml as ${env.HF_CACHE}. It cannot be ${HOME} (llama-swap's `cmd` is
# exec'd without a shell) and must not be ${env.HOME} (that is the service
# account's home, /var/lib/llama-swap — a valid-looking wrong path that would
# silently re-download 21.85 GiB). This is why the value is set here, where
# machine-specific paths already live.
llama_swap_hf_cache: "{{ target_home }}/.cache/huggingface/hub"

# The credential store — see configure.sh, which is the only thing that writes
# to it, and ansible/roles/secrets, which is the only thing that reads it.
#
# Plain root-owned files, mode 0600, in a 0700 directory. Deliberately not
# encrypted: the same secrets end up in plaintext in gh's token store and
# ~/.hermes/.env on this same disk, so encrypting the source while its copies
# sit unencrypted would be ceremony rather than security. Protecting the disk
# is a full-disk-encryption question.
#
# NOT in this repo, and never should be. Back it up separately — a git clone
# plus a restored credstore is what makes ./setup.sh able to rebuild this
# machine without a human retyping anything.
secrets_vault_dir: "/etc/dgx-spark/credstore"

# Tags advertised at `tailscale up`. An OAuth client secret REQUIRES a tag and
# will be rejected without one; a plain auth key does not. Must match a tag the
# OAuth client is scoped to, and the tag must exist in your tailnet ACL.
# Empty means the flag is omitted entirely.
tailscale_tags: ""

# Repo-managed Hermes agent profiles.
#
# Each profile is materialised from files under profiles/<name>/ — see
# ansible/roles/hermes_profiles. Adding a profile means adding an entry here
# plus a profiles/<name>/ directory; the role needs no change.
#
# `env` entries are written into the profile's .env with lineinfile, so this
# repo owns those specific keys while leaving any real credential in the same
# file alone. Keep secrets out of here — .env is the right place for those and
# configure.sh is the way in.
hermes_profiles:
  - name: sysadmin
    env: []
  - name: harbor
    env:
      # Confines the file tools to the project tree. This is a focus
      # mechanism, not a security boundary — the terminal tool is not bound
      # by it, and nothing here is trying to contain a hostile agent.
      - key: HERMES_WRITE_SAFE_ROOT
        value: "{{ target_home }}/development/harbor"

# Same cross-repo reference as chezmoi_source and llama_swap_config_source
# above: the source of truth lives where it is readable and reviewable.
#
# Note that skills are NOT copied out of here. Each profile's config.yaml
# points skills.external_dirs at profiles/<name>/skills in this checkout, and
# Hermes reads them in place. See the role for why that matters.
hermes_profiles_source: "{{ playbook_dir | dirname }}/profiles"
hermes_profiles_root: "{{ target_home }}/.hermes/profiles"

# Mirrors _PROFILE_DIRS in hermes_cli/profiles.py — a private constant in
# Hermes, so this is a coupling to its internals rather than to a published
# contract. If a future version adds a directory, this list is where to look.
hermes_profile_skeleton_dirs:
  - memories
  - sessions
  - skills
  - skins
  - logs
  - plans
  - workspace
  - cron
  - home
