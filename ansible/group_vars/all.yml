# Shared variables for all hosts

# Target user to configure (passed explicitly by setup.sh)
target_user: "{{ ansible_user_id }}"
target_home: "/home/{{ target_user }}"

# chezmoi source directory, resolved relative to this repo checkout
chezmoi_source: "{{ playbook_dir | dirname }}/chezmoi"

# Where Ollama stores model weights. This is Ollama's own default, pinned
# explicitly via a systemd drop-in so the location is never a surprise.
ollama_models_dir: "/usr/share/ollama/.ollama/models"
