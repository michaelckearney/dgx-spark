---
# Role: hermes_sysadmin
# Materialises the `sysadmin` Hermes profile from files in this repo.
#
# The profile's job is to make OS changes THROUGH this repo — edit the tooling
# role, converge, verify, commit — rather than by touching the machine
# directly. Its operating contract is profiles/sysadmin/SOUL.md.
#
# Why files rather than `hermes profile create`:
#
#   * Profiles are pure filesystem. get_profile_dir() in hermes_cli/profiles.py
#     is `_get_profiles_root() / name`, and profile discovery iterates that
#     directory filtering on a name regex. There is no registry to enrol with —
#     a directory with the right name IS a profile.
#   * `create_profile()` raises FileExistsError on a second run, so calling it
#     would need guarding to stay idempotent.
#   * As a `command:` task it would also be invisible to --check. Every task
#     below is a file/copy module, so a dry run actually reports this role.
#
# HAZARD, stated plainly: this role puts the profile's own config.yaml — and
# therefore its own approval mode — in a repository that the profile can edit.
# An agent that changed `approvals.mode` to `off` and re-ran the playbook would
# be granting itself unattended root. Three things stand against that: it
# commits but never pushes, so the change is visible before it leaves the
# machine; SOUL.md puts profiles/sysadmin/ out of bounds; and any diff touching
# that path is a review stop-sign. Treat it as one.
#
# Deliberately absent: a gateway. This profile is reachable over SSH only, so
# there is no path from an inbound message to a root shell.

- name: Check whether the Hermes home exists
  ansible.builtin.stat:
    path: "{{ target_home }}/.hermes"
  register: hermes_home

# The hermes role installs with `creates:`, and shell modules don't run in
# check mode — so on a --check against a machine without Hermes yet, that
# install is skipped and this directory doesn't exist. Gate the same way the
# ollama and llama_swap roles gate their post-install blocks.
#
# The gate is also what keeps the tasks below from creating ~/.hermes itself
# as root. Ansible's file module applies ownership to the final path component
# only, so a root-owned parent here would leave the DEFAULT profile unwritable
# by the user who owns it.
- name: Configure the sysadmin profile
  when: hermes_home.stat.exists
  block:

    - name: Ensure the Hermes profiles root exists
      ansible.builtin.file:
        path: "{{ target_home }}/.hermes/profiles"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Ensure the sysadmin profile directory exists
      ansible.builtin.file:
        path: "{{ hermes_sysadmin_profile_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    # Mirrors _PROFILE_DIRS in hermes_cli/profiles.py — a private constant, so
    # this is a coupling to Hermes' internals rather than to a published
    # contract. If a future version adds a directory, this list is where to
    # look. Bootstrapped empty; Hermes fills them as it runs.
    - name: Create the sysadmin profile skeleton
      ansible.builtin.file:
        path: "{{ hermes_sysadmin_profile_dir }}/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"
      loop:
        - memories
        - sessions
        - skills
        - skins
        - logs
        - plans
        - workspace
        - cron
        - home

    # This looks like boilerplate and is load-bearing. From the comment on the
    # equivalent step in create_profile(): without its own .env, a profile
    # "silently inherited API keys from the shell environment" — so omitting
    # this hands the sysadmin profile whatever the ambient environment happens
    # to export. force: false because a credential written here later is real
    # state that this repo does not own and must never clobber.
    - name: Seed the profile's own .env
      ansible.builtin.copy:
        dest: "{{ hermes_sysadmin_profile_dir }}/.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        force: false
        content: |
          # Per-profile secrets for the sysadmin Hermes profile.
          # Behavioral settings belong in config.yaml, not here.

    # force: true on both — the repo is authoritative for these two files, the
    # same contract the chezmoi role states for dotfiles. Edit the source in
    # profiles/sysadmin/, not the copy under ~/.hermes.
    - name: Install the sysadmin profile's operating contract
      ansible.builtin.copy:
        src: "{{ hermes_sysadmin_profile_source }}/SOUL.md"
        dest: "{{ hermes_sysadmin_profile_dir }}/SOUL.md"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
        force: true

    # Without a model block Hermes resolves no provider and the first turn dies
    # with "No LLM provider configured" — created, but unable to run.
    - name: Install the sysadmin profile's config
      ansible.builtin.copy:
        src: "{{ hermes_sysadmin_profile_source }}/config.yaml"
        dest: "{{ hermes_sysadmin_profile_dir }}/config.yaml"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
        force: true
