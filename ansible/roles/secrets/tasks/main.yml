---
# Role: secrets
# Applies the secrets that configure.sh stored, and nothing else.
#
# configure.sh acquires — it prompts a human and writes to the credential
# store. This role distributes. That split is what makes secrets converge like
# everything else in this repo: the store is the source of truth, each
# consumer is derived from it, and a machine rebuilt from a git clone plus a
# restored store needs no human to retype anything.
#
# THE CONVERGENCE RULE IS NOT THE SAME FOR EVERY SECRET, and the difference
# matters:
#
#   github    gh will hand its token back (`gh auth token`), so this is a
#             plain diff — re-authenticate only when the values differ.
#   telegram  the value lives in a readable file, so lineinfile does the diff
#             and the handler fires only on a real change. That is what keeps
#             an unrelated converge from bouncing the gateway.
#   tailscale nothing hands the key back and nothing needs it twice — it is
#             spent at join. So the probe is "are we on the tailnet", and a
#             joined machine is left completely alone.
#
# A general vault-versus-consumer diff would either no-op forever on Tailscale
# or re-run `tailscale up` against a healthy node. Hence three rules.
#
# Every task that touches a value carries no_log: true. Ansible would otherwise
# print the secret in its own output on a change or a failure.

# XDG_RUNTIME_DIR below needs the login user's numeric uid. It cannot come
# from ansible_facts: this play runs with become, so the connecting-user facts
# describe root, not the user whose gateway this is.
- name: Resolve the target user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"

- name: Look for a stored GitHub token
  ansible.builtin.stat:
    path: "{{ secrets_vault_dir }}/github"
  register: secret_github

- name: Look for a stored Telegram token
  ansible.builtin.stat:
    path: "{{ secrets_vault_dir }}/telegram"
  register: secret_telegram

- name: Look for a stored Telegram allowlist
  ansible.builtin.stat:
    path: "{{ secrets_vault_dir }}/telegram_allowed_users"
  register: secret_telegram_allowed

- name: Look for a stored Tailscale credential
  ansible.builtin.stat:
    path: "{{ secrets_vault_dir }}/tailscale"
  register: secret_tailscale

# --- github ------------------------------------------------------------------

- name: Apply the GitHub token
  when: secret_github.stat.exists
  block:

    - name: Read the stored GitHub token
      ansible.builtin.slurp:
        src: "{{ secrets_vault_dir }}/github"
      register: github_stored
      no_log: true

    # gh keeps its token per-user, so this must run as the login user rather
    # than as root. It exits non-zero when nothing is authenticated, which is
    # the normal first-run state and not an error.
    - name: Ask gh for its current token
      ansible.builtin.command: gh auth token
      register: github_current
      changed_when: false
      failed_when: false
      check_mode: false          # read-only probe; safe during --check
      become: true
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ target_home }}"
      no_log: true

    # Passed on stdin, never in argv — argv is world-readable via ps for the
    # life of the process.
    - name: Authenticate gh with the stored token
      ansible.builtin.command: gh auth login --with-token
      args:
        stdin: "{{ github_stored.content | b64decode }}"
      become: true
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ target_home }}"
      when: >-
        github_current.rc != 0
        or (github_current.stdout | trim) != (github_stored.content | b64decode | trim)
      no_log: true

# --- telegram ----------------------------------------------------------------

- name: Apply the Telegram configuration
  when: secret_telegram.stat.exists
  block:

    - name: Read the stored Telegram token
      ansible.builtin.slurp:
        src: "{{ secrets_vault_dir }}/telegram"
      register: telegram_stored
      no_log: true

    # The default profile's own .env. Deliberately the literal path rather
    # than `hermes config env-path`: a command module would not run under
    # --check, and this location is fixed for the default profile.
    #
    # force: false has no equivalent here — the file already exists by the
    # time this runs, and lineinfile only touches the one key it names. Every
    # other line, including anything `hermes auth add` wrote, survives.
    - name: Ensure the Hermes .env exists
      ansible.builtin.copy:
        dest: "{{ target_home }}/.hermes/.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        force: false
        content: |
          # Hermes credentials. Managed in part by the dgx-spark repo —
          # TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOWED_USERS come from
          # /etc/dgx-spark/credstore via ansible/roles/secrets.

    # lineinfile is the diff. The handler fires only when the line actually
    # changes, which is what stops an unrelated converge — an added apt
    # package, say — from restarting the gateway underneath a live
    # conversation.
    - name: Set the Telegram bot token
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.hermes/.env"
        regexp: '^(export[[:space:]]+)?TELEGRAM_BOT_TOKEN='
        line: "TELEGRAM_BOT_TOKEN={{ telegram_stored.content | b64decode | trim }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
      notify: restart hermes gateway
      no_log: true

    - name: Read the stored Telegram allowlist
      ansible.builtin.slurp:
        src: "{{ secrets_vault_dir }}/telegram_allowed_users"
      register: telegram_allowed_stored
      when: secret_telegram_allowed.stat.exists

    # Not via `hermes config set`: that key has no dot, isn't in the API-key
    # list, and doesn't end in _TOKEN or _SECRET, so it lands in config.yaml as
    # a top-level key that nothing reads. .env is the canonical route — env
    # wins over YAML in every bridge.
    #
    # Written even when the stored allowlist is empty, so clearing it in
    # configure.sh actually clears it here rather than leaving the old list in
    # place. Blank is a safe value: Hermes denies unknown senders and routes
    # them through DM pairing.
    - name: Set the Telegram allowlist
      ansible.builtin.lineinfile:
        path: "{{ target_home }}/.hermes/.env"
        regexp: '^(export[[:space:]]+)?TELEGRAM_ALLOWED_USERS='
        line: >-
          TELEGRAM_ALLOWED_USERS={{
            (telegram_allowed_stored.content | b64decode | trim)
            if secret_telegram_allowed.stat.exists else ''
          }}
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
      notify: restart hermes gateway

    # A user service with no logged-in session dies with the session that
    # started it. Lingering is what lets the gateway survive logout and come
    # back after a reboot, which is the whole point of --start-on-login.
    - name: Allow the login user's services to run without a session
      ansible.builtin.command: "loginctl enable-linger {{ target_user }}"
      args:
        creates: "/var/lib/systemd/linger/{{ target_user }}"

    # A no-op when the unit already exists — it prints "Service already
    # installed" and returns without restarting. The restart is the handler's
    # job, and only on a real change.
    - name: Install the Hermes gateway service
      ansible.builtin.command: hermes gateway install --start-now --start-on-login
      register: gateway_install
      changed_when: "'already installed' not in (gateway_install.stdout | lower)"
      become: true
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ target_home }}"
        PATH: "{{ target_home }}/.local/bin:{{ ansible_env.PATH }}"
        XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[target_user][1] }}"

# --- tailscale ---------------------------------------------------------------

- name: Apply the Tailscale credential
  when: secret_tailscale.stat.exists
  block:

    # `tailscale status` exits non-zero when logged out, so it doubles as the
    # joined-or-not probe without needing jq to read the backend state.
    - name: Check whether this machine is already on the tailnet
      ansible.builtin.command: tailscale status
      register: tailscale_state
      changed_when: false
      failed_when: false
      check_mode: false          # read-only probe; safe during --check

    # EVERYTHING BELOW IS GATED ON NOT BEING JOINED, and that gate is the most
    # important line in this role.
    #
    # An unconditional `tailscale up` against a working node re-authenticates
    # it. If the stored credential has expired, been revoked, or was stored
    # wrong, that turns a converge into a lockout on the one path that reaches
    # this machine remotely. A joined node is left alone, every time, and the
    # stored credential exists for the next rebuild rather than for this run.
    - name: Join the tailnet
      when: tailscale_state.rc != 0
      block:

        - name: Read the stored Tailscale credential
          ansible.builtin.slurp:
            src: "{{ secrets_vault_dir }}/tailscale"
          register: tailscale_stored
          no_log: true

        # By file reference rather than on the command line: argv is
        # world-readable via ps for as long as the process runs.
        - name: Stage the credential where tailscale can read it
          ansible.builtin.copy:
            dest: /run/tailscale-authkey
            content: "{{ tailscale_stored.content | b64decode | trim }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        # --operator is {{ target_user }} and NOT `id -un`: this play runs as
        # root, so the shell form would hand operator rights to root and leave
        # the login user needing sudo for `tailscale status`.
        #
        # No --reset. `tailscale up` with a different flag set than the node
        # currently has will refuse rather than silently reconfigure, and that
        # refusal is information — not something to paper over.
        - name: Bring the tailnet interface up
          ansible.builtin.command: >-
            tailscale up
            --auth-key=file:/run/tailscale-authkey
            --operator={{ target_user }}
            {% if tailscale_tags %}--advertise-tags={{ tailscale_tags }}{% endif %}
          register: tailscale_up

      rescue:
        # An OAuth client secret REQUIRES a tag and an auth key does not, which
        # is far and away the most common way a first join fails. Say so rather
        # than leaving someone to decode Tailscale's raw error.
        - name: Explain the most likely cause, then fail
          ansible.builtin.fail:
            msg: >-
              Joining the tailnet failed.
              An OAuth client secret requires a tag: set tailscale_tags in
              ansible/group_vars/all.yml to a tag the client is scoped to, and
              make sure that tag exists in your tailnet ACL. A one-off auth key
              needs no tag, but works exactly once and expires within 90 days.
              The stored credential was not changed — fix and re-run ./setup.sh.
              tailscale said: {{ tailscale_up.stderr | default('(nothing on stderr)') }}

      always:
        - name: Remove the staged credential
          ansible.builtin.file:
            path: /run/tailscale-authkey
            state: absent
