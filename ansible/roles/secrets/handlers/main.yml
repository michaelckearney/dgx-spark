---
# `gateway install` returns without restarting when the unit already exists,
# and the gateway reads ~/.hermes/.env only at startup. So on a rotation the
# running process would keep serving the old token while the file held the
# new one. This handler is what makes rotation take effect — and because it is
# a handler, it fires only when a token line actually changed.
- name: restart hermes gateway
  ansible.builtin.command: hermes gateway restart
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
    PATH: "{{ target_home }}/.local/bin:{{ ansible_env.PATH }}"
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[target_user][1] }}"
