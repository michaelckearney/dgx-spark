---
# Role: chezmoi
# Installs chezmoi and applies user-level dotfiles from the repo.

- name: Check if chezmoi is installed
  ansible.builtin.command: which chezmoi
  register: chezmoi_check
  changed_when: false
  failed_when: false
  check_mode: false          # read-only probe; safe to run during --check

- name: Install chezmoi
  ansible.builtin.shell: |
    curl -fsLS get.chezmoi.io | sh -s -- -b /usr/local/bin
  args:
    creates: /usr/local/bin/chezmoi
  when: chezmoi_check.rc != 0

# --force and --no-tty are load-bearing, not defensive noise.
#
# Other installers write to files chezmoi owns — the Hermes installer appends
# a PATH line to ~/.zshrc, ~/.bashrc and ~/.profile. On the next run chezmoi
# notices "~/.zshrc has changed since chezmoi last wrote it", tries to prompt
# for what to do, finds no TTY under Ansible, and the whole play fails. That
# made this playbook succeed on first run and fail on every run after.
#
# --force makes chezmoi authoritative: it overwrites those external edits
# without asking, which is exactly the contract this repo wants for dotfiles.
# Local edits to chezmoi-managed files are discarded on the next ./setup.sh —
# edit the source in chezmoi/ instead.
#
# --no-tty guarantees that any future prompt fails loudly instead of hanging
# forever waiting on a terminal that isn't there.
- name: Initialize chezmoi and apply dotfiles
  ansible.builtin.command:
    argv:
      - chezmoi
      - init
      - --source
      - "{{ chezmoi_source }}"
      - --apply
      - --force
      - --no-tty
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
    # Consumed by chezmoi/dot_gitconfig.tmpl so the git identity isn't
    # hardcoded to one person. See git_user_name / git_user_email in
    # ansible/group_vars/all.yml.
    CHEZMOI_GIT_USER_NAME: "{{ git_user_name }}"
    CHEZMOI_GIT_USER_EMAIL: "{{ git_user_email }}"
  changed_when: true
