---
# Role: tooling
# Installs baseline CLI tooling and the zsh prompt stack.
#
# The login shell switch deliberately does NOT happen here — it runs in
# playbook.yml post_tasks, after chezmoi has applied ~/.zshrc, so the shell
# never changes before its configuration exists.
#
# ffmpeg is deliberately NOT installed. The Hermes wizard offers it alongside
# ripgrep, but its only purpose there is TTS voice messages through a
# messaging gateway, which this setup doesn't use. It costs ~73 packages and
# ~174 MB of desktop multimedia stack (SDL2, OpenAL, JACK, mesa VA drivers,
# pocketsphinx) on a headless box. If you enable Telegram and want voice
# messages, add it back to the list below.

- name: Install baseline shell tooling packages
  ansible.builtin.apt:
    name:
      - vim
      - zsh
      - git
      # ripgrep is a Hermes Agent helper (faster file search). Its installer
      # normally offers to install it, but that prompt lives in the setup
      # wizard, which --non-interactive skips. See the hermes role.
      - ripgrep
    state: present
    # Nothing else in this repo refreshes the apt index, and DGX OS doesn't
    # do it on its own. Left stale, the index points at package versions the
    # mirrors have already withdrawn and every install fails with 404s —
    # which is exactly what happened the first time this role had to fetch
    # something rather than finding it already installed.
    update_cache: true
    cache_valid_time: 3600

# This must run BEFORE the custom/themes directory is created below: git
# refuses to clone into a directory that already exists and is non-empty,
# and creating custom/themes first implicitly creates ~/.oh-my-zsh.
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ target_home }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ target_user }}"

- name: Ensure Oh My Zsh custom themes directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.oh-my-zsh/custom/themes"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

- name: Install Powerlevel10k theme for Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ target_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: master
    depth: 1
    update: true
  become: true
  become_user: "{{ target_user }}"
