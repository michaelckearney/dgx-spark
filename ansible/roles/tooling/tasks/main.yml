---
# Role: tooling
# Installs baseline CLI tooling and the zsh prompt stack.
#
# The login shell switch deliberately does NOT happen here — it runs in
# playbook.yml post_tasks, after chezmoi has applied ~/.zshrc, so the shell
# never changes before its configuration exists.

- name: Install baseline shell tooling packages
  ansible.builtin.package:
    name:
      - vim
      - zsh
      - git
      # ripgrep and ffmpeg are Hermes Agent helpers. Its installer normally
      # offers to install them, but that prompt lives in the setup wizard,
      # which --non-interactive skips (see the hermes role). Installing them
      # here covers the gap; both are independently useful anyway.
      - ripgrep
      - ffmpeg
    state: present

# This must run BEFORE the custom/themes directory is created below: git
# refuses to clone into a directory that already exists and is non-empty,
# and creating custom/themes first implicitly creates ~/.oh-my-zsh.
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ target_home }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ target_user }}"

- name: Ensure Oh My Zsh custom themes directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.oh-my-zsh/custom/themes"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

- name: Install Powerlevel10k theme for Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ target_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: master
    depth: 1
    update: true
  become: true
  become_user: "{{ target_user }}"
