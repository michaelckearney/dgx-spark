---
- name: Configure DGX Spark workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  roles:
    - docker
    - sudo
    - tooling
    - tailscale
    - ollama
    # After docker: the service account needs the `docker` group to exist.
    # Before hermes: the hermes role's completion message points you at an
    # endpoint to configure, and that endpoint is now this gateway.
    - llama_swap
    - chezmoi
    # After chezmoi: once ~/.hermes/config.yaml is chezmoi-managed, chezmoi
    # lays it down first and the Hermes installer preserves the existing file
    # rather than overwriting it with its template.
    - hermes
    # After hermes: the profile directories this role writes into live under
    # the Hermes home that the installer creates, and the role skips entirely
    # when that home isn't there yet.
    - hermes_profiles
    # Last of the roles: every consumer it writes to has to exist first — gh
    # from tooling, ~/.hermes/.env from hermes, tailscaled from tailscale.
    # It is also the only role that does nothing at all on a machine where
    # configure.sh has never run, which is the intended resting state.
    - secrets

  post_tasks:
    # Deliberately last. Switching the login shell before Oh My Zsh,
    # Powerlevel10k, and the chezmoi-managed ~/.zshrc are all in place
    # leaves you logging into a bare, unconfigured zsh.
    - name: Ensure target user's login shell is zsh
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /usr/bin/zsh
