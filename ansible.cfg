# Ansible configuration for this repo. Present so that `ansible-playbook
# site.yml` works from a clone with no flags and no environment — setup.sh
# passes nothing that isn't strictly necessary.
[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
# YAML-formatted results from the built-in callback rather than
# community.general.yaml — same readability, no collection dependency, so a
# bare ansible-core install works.
result_format      = yaml
# Skipped tasks are the normal case here: every optional secret and every
# already-installed package skips. Showing them buries the few lines that
# matter.
display_skipped_hosts = false
# This repo targets one machine and never needs a cache; showing the host
# name on every line adds width for no information.
show_per_host_start = false
interpreter_python = auto_silent
force_valid_group_names = ignore
retry_files_enabled = false

[privilege_escalation]
# Deliberately NOT `become = True`. The play runs as the login user, and only
# the tasks that genuinely need root ask for it. Doing it the other way round
# means every user-level task has to undo it with become_user, which is how
# the previous layout ended up passing target_user/target_home everywhere.
become = False
